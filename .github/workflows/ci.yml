name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified build to the production Worker
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Runs for the same ref queue in arrival order (never cancelling a run that
# may be mid-deploy), so an older main run can never start deploying after a
# newer one. PR runs cancel superseded in-progress runs instead.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Pinned for deterministic build-time KaTeX output. Do not upgrade casually.
  HUGO_VERSION: "0.164.0"
  HUGO_SHA256: "fea17b8c076f950bb2e9f9486667bdaa29422883888d509d63931c73e8a9b3a4"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Hugo extended (pinned)
        run: |
          curl -fsSL -o /tmp/hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  /tmp/hugo.tar.gz" | sha256sum --check -
          sudo tar -xzf /tmp/hugo.tar.gz -C /usr/local/bin hugo
          hugo version

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .hugo_cache
          key: hugo-${{ runner.os }}-${{ env.HUGO_VERSION }}-${{ hashFiles('content/**', 'layouts/**', 'assets/**') }}
          restore-keys: |
            hugo-${{ runner.os }}-${{ env.HUGO_VERSION }}-

      - run: npm ci
      # The whole verification pipeline lives in package.json's `ci` script —
      # tests, build, built-artifact checks, then one Playwright invocation
      # covering accessibility AND the grader end-to-end suite (regressions
      # that only surface through the real MathLive field). Encoding the
      # sequence once means a gate added to `npm run ci` can never be missed
      # here. Playwright launches the runner's preinstalled Chrome through
      # tools/build/chrome-stdio-shim.sh (the executablePath in
      # playwright.config.mjs), so no browser install step is needed.
      - run: npm run ci

      # Hand the exact verified `public/` to the deploy job. Deploying a
      # second, freshly built artifact would ship bytes no gate ever saw.
      - name: Upload verified build
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy == true))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-public-${{ github.sha }}
          path: public
          retention-days: 3
          if-no-files-found: error

  deploy:
    name: Deploy production
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true &&
      github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Wrangler still runs on Node; keep the pinned version even though this
      # job no longer builds anything itself.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      # If main moved past this commit while verification ran, skip rather
      # than overwrite a newer deployment with an older application.
      - name: Check this commit is still the main head
        id: head
        run: |
          git fetch --quiet origin main
          head="$(git rev-parse origin/main)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy: main is now $head, this run built $GITHUB_SHA"
          fi

      # Deploy the exact artifact the verify job tested — no second build.
      - name: Download verified build
        if: steps.head.outputs.fresh == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-public-${{ github.sha }}
          path: public

      - name: Deploy static assets to Cloudflare Workers
        if: steps.head.outputs.fresh == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.112.0"
          command: deploy

      # The deployed origin must answer over HTTPS with the security baseline
      # from static/_headers. The plain-HTTP redirect is a Cloudflare zone
      # setting ("Always Use HTTPS") that no repository file can enforce, so
      # its absence is a loud warning rather than a failed deploy.
      - name: Post-deploy smoke test
        if: steps.head.outputs.fresh == 'true'
        run: |
          # The full policy contract is parsed and asserted BEFORE deploy by
          # tools/build/audit-build.mjs; this confirms the edge actually serves it.
          #
          # Bounded polling with a cache-busting query, not one fixed sleep:
          # a single probe once hit a Cloudflare edge cache entry from BEFORE
          # the _headers deploy (cf-cache-status: HIT, no security headers)
          # and failed the run although the deployment itself had succeeded.
          # The unique query string forces a cache miss so the probe always
          # exercises the freshly deployed Worker.
          check_headers() {
            headers="$(curl -sS -D - -o /dev/null --max-time 30 \
              -H 'Cache-Control: no-cache' \
              "https://athenaeumpopuli.org/?smoke=${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}-$1")"
            echo "$headers" | grep -qi '^HTTP/[^ ]* 200' || return 1
            for header in \
              'x-content-type-options' \
              'strict-transport-security' \
              'x-frame-options' \
              'referrer-policy' \
              'permissions-policy' \
              'cross-origin-opener-policy'; do
              echo "$headers" | grep -qi "^${header}:" || return 1
            done
            echo "$headers"
            return 0
          }
          ok=''
          for attempt in 1 2 3 4 5 6 7 8; do
            if check_headers "$attempt"; then ok=1; break; fi
            echo "attempt ${attempt}/8: deployed origin not serving the header contract yet; retrying in 15s"
            sleep 15
          done
          [ -n "$ok" ] || { echo '::error::deployed origin never served HTTPS 200 with the full header contract (8 attempts over ~2 minutes)'; exit 1; }
          http_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 http://athenaeumpopuli.org/ || echo 000)"
          case "$http_status" in
            301|302|307|308) echo "plain HTTP redirects to HTTPS ($http_status)" ;;
            *) echo "::warning::http://athenaeumpopuli.org/ answered $http_status without redirecting — enable 'Always Use HTTPS' on the Cloudflare zone, then HSTS at the edge" ;;
          esac
