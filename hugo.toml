# Athenaeum Populi — Hugo site configuration
#
# Pinned Hugo: extended v0.164.0.
# Theme: Hextra v0.12.3, VENDORED into themes/hextra (classic theme mode,
# NOT Hugo Modules — no Go toolchain). Do not switch to module imports.
#
# Upgrade Hugo or Hextra only with deliberate compatibility testing.

baseURL = "https://athenaeumpopuli.org/"
title = "Athenaeum Populi"
theme = "hextra"
enableInlineShortcodes = true
enableRobotsTXT = true
enableEmoji = true
disableKinds = ["taxonomy", "term"]

# Keep Hugo exact because its embedded KaTeX renderer is version-coupled to the
# vendored CSS. The Node toolchain test independently enforces this local pin.
[module]
  [module.hugoVersion]
    extended = true
    min = "0.164.0"
    max = "0.164.0"

# The site publishes HTML only.
[outputs]
  home = ["html"]
  section = ["html"]
  page = ["html"]

# --- Markup -----------------------------------------------------------------
[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true          # required: content contains raw HTML / component markup
  [markup.goldmark.extensions.passthrough]
    enable = true
    # The corpus uses $...$ inline and $$...$$ block delimiters.
    # We MUST accept `$` inline for parity, plus the \(...\) / \[...\] forms.
    [markup.goldmark.extensions.passthrough.delimiters]
      block  = [['$$', '$$'], ['\[', '\]']]
      inline = [['$', '$'],   ['\(', '\)']]

# --- Params -----------------------------------------------------------------
[params]
  # Social-card image (og:image / twitter:image on every page): the 512px
  # raster site icon — scrapers ignore SVG, so this must be a PNG.
  images = ["android-chrome-512x512.png"]

  # Reader-facing contact address. Rendered as a persistent "Questions or
  # concerns?" mailto link in the right rail (layouts/_partials/toc.html),
  # with the subject line pre-filled from the page being read.
  [params.contact]
    email = "contact@athenaeumpopuli.org"

  # Navbar logo (book glyph, static/images/). The dark variant must be named
  # explicitly — the theme otherwise reuses the light (black-ink) file, which
  # is invisible on the dark navbar.
  [params.navbar]
    displayTitle = true
    displayLogo = true
    [params.navbar.logo]
      path = "images/logo.svg"
      dark = "images/logo-dark.svg"
      width = "22"
      height = "22"

  # Let the documentation rails use the viewport edges. The article itself
  # keeps Hextra's readable max-width inside the space between the two rails.
  [params.page]
    width = "full"

  [params.math]
    engine = "katex"       # Build-time KaTeX renderer; do not switch to MathJax.
    # CRITICAL: the build-time path (transform.ToMath) is rendered by the KaTeX
    # embedded IN THE HUGO BINARY — v0.16.22 for Hugo 0.164.0. The CSS MUST match
    # that exact version or fractions/roots mis-position. Hextra otherwise loads
    # katex@latest (0.18.1), whose class contract differs → broken layout.
    # This pin is dictated by Hugo, not a free choice; revisit only if Hugo is
    # (deliberately) upgraded. Hextra self-hosts this CSS + fonts at build time.
    [params.math.katex]
      # Vendored under static/katex so clean/offline builds never depend on a CDN.
      base = "/katex"

  [params.theme]
    default = "system"
    displayToggle = true

  # Load the vanilla Web Components bundle (esbuild via Hugo Pipes js.Build).
  [params.components]
    enable = true

  [params.search]
    enable = true
    type = "pagefind"

# Top navbar = the published subject categories and project information.
# `class = "ap-nav-page"` marks the entries that fold away with the shelves
# once the reader scrolls (assets/js/navbar-compact.js, "Compact navbar on
# scroll" in assets/css/custom.css); search and the logo stay.
[menu]
  [[menu.main]]
    name = "Home"
    pageRef = "/"
    weight = 1
    [menu.main.params]
      class = "ap-nav-page"
  # The six shelves appear twice, never both visible: as flat links from xl
  # (80rem) up, where they fit beside the title, and folded into one "Library"
  # dropdown from md (48rem) to xl, where six flat links overflowed the bar and
  # pushed the site title off-screen. Below md Hextra's hamburger drawer takes
  # over and lists the flat entries (the drawer skips `drawer = false`). The
  # `class` param is emitted by layouts/_partials/navbar-link.html and switched
  # by the media rules in assets/css/custom.css.
  [[menu.main]]
    identifier = "math"
    name = "Math"
    pageRef = "/math"
    weight = 2
    [menu.main.params]
      class = "ap-nav-shelf"
  [[menu.main]]
    identifier = "physical-sciences"
    name = "Physical Sciences"
    pageRef = "/physical-sciences"
    weight = 3
    [menu.main.params]
      class = "ap-nav-shelf"
  [[menu.main]]
    identifier = "life-health-sciences"
    name = "Life & Health Sciences"
    pageRef = "/life-health-sciences"
    weight = 4
    [menu.main.params]
      class = "ap-nav-shelf"
  [[menu.main]]
    identifier = "engineering-computing"
    name = "Engineering & Computing"
    pageRef = "/engineering-computing"
    weight = 5
    [menu.main.params]
      class = "ap-nav-shelf"
  [[menu.main]]
    identifier = "social-sciences-business"
    name = "Social Sciences & Business"
    pageRef = "/social-sciences-business"
    weight = 6
    [menu.main.params]
      class = "ap-nav-shelf"
  [[menu.main]]
    identifier = "humanities"
    name = "Humanities"
    pageRef = "/humanities"
    weight = 7
    [menu.main.params]
      class = "ap-nav-shelf"
  [[menu.main]]
    identifier = "library"
    name = "Library"
    weight = 8
    [menu.main.params]
      class = "ap-nav-library"
      drawer = false
  [[menu.main]]
    identifier = "library-math"
    parent = "library"
    name = "Math"
    pageRef = "/math"
    weight = 1
  [[menu.main]]
    identifier = "library-physical-sciences"
    parent = "library"
    name = "Physical Sciences"
    pageRef = "/physical-sciences"
    weight = 2
  [[menu.main]]
    identifier = "library-life-health-sciences"
    parent = "library"
    name = "Life & Health Sciences"
    pageRef = "/life-health-sciences"
    weight = 3
  [[menu.main]]
    identifier = "library-engineering-computing"
    parent = "library"
    name = "Engineering & Computing"
    pageRef = "/engineering-computing"
    weight = 4
  [[menu.main]]
    identifier = "library-social-sciences-business"
    parent = "library"
    name = "Social Sciences & Business"
    pageRef = "/social-sciences-business"
    weight = 5
  [[menu.main]]
    identifier = "library-humanities"
    parent = "library"
    name = "Humanities"
    pageRef = "/humanities"
    weight = 6
  [[menu.main]]
    name = "About"
    pageRef = "/about"
    weight = 9
    [menu.main.params]
      class = "ap-nav-page"
  [[menu.main]]
    name = "Search"
    weight = 10
    [menu.main.params]
      type = "search"
