# Athenaeum Populi — Hugo site configuration
#
# Pinned Hugo: extended v0.164.0.
# Theme: Hextra v0.12.3, VENDORED into themes/hextra (classic theme mode,
# NOT Hugo Modules — no Go toolchain). Do not switch to module imports.
#
# Upgrade Hugo or Hextra only with deliberate compatibility testing.

baseURL = "https://athenaeumpopuli.org/"
title = "Athenaeum Populi"
theme = "hextra"
enableInlineShortcodes = true
enableRobotsTXT = true
enableEmoji = true
disableKinds = ["taxonomy", "term"]

# Keep Hugo exact because its embedded KaTeX renderer is version-coupled to the
# vendored CSS. The Node toolchain test independently enforces this local pin.
[module]
  [module.hugoVersion]
    extended = true
    min = "0.164.0"
    max = "0.164.0"

# The site publishes HTML only.
[outputs]
  home = ["html"]
  section = ["html"]
  page = ["html"]

# --- Markup -----------------------------------------------------------------
[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true          # required: content contains raw HTML / component markup
  [markup.goldmark.extensions.passthrough]
    enable = true
    # The corpus uses $...$ inline and $$...$$ block delimiters.
    # We MUST accept `$` inline for parity, plus the \(...\) / \[...\] forms.
    [markup.goldmark.extensions.passthrough.delimiters]
      block  = [['$$', '$$'], ['\[', '\]']]
      inline = [['$', '$'],   ['\(', '\)']]

# --- Params -----------------------------------------------------------------
[params]
  # Reader-facing contact address. Rendered as a persistent "Questions or
  # concerns?" mailto link in the right rail (layouts/_partials/toc.html),
  # with the subject line pre-filled from the page being read.
  [params.contact]
    email = "contact@athenaeumpopuli.org"

  # Let the documentation rails use the viewport edges. The article itself
  # keeps Hextra's readable max-width inside the space between the two rails.
  [params.page]
    width = "full"

  [params.math]
    engine = "katex"       # Build-time KaTeX renderer; do not switch to MathJax.
    # CRITICAL: the build-time path (transform.ToMath) is rendered by the KaTeX
    # embedded IN THE HUGO BINARY — v0.16.22 for Hugo 0.164.0. The CSS MUST match
    # that exact version or fractions/roots mis-position. Hextra otherwise loads
    # katex@latest (0.18.1), whose class contract differs → broken layout.
    # This pin is dictated by Hugo, not a free choice; revisit only if Hugo is
    # (deliberately) upgraded. Hextra self-hosts this CSS + fonts at build time.
    [params.math.katex]
      # Vendored under static/katex so clean/offline builds never depend on a CDN.
      base = "/katex"

  [params.theme]
    default = "system"
    displayToggle = true

  # Load the vanilla Web Components bundle (esbuild via Hugo Pipes js.Build).
  [params.components]
    enable = true

  [params.search]
    enable = true
    type = "pagefind"

# Top navbar = the published subject categories and project information.
[menu]
  [[menu.main]]
    name = "Home"
    pageRef = "/"
    weight = 1
  [[menu.main]]
    name = "Math"
    pageRef = "/math"
    weight = 2
  [[menu.main]]
    name = "Biology"
    pageRef = "/biology"
    weight = 3
  [[menu.main]]
    name = "Chemistry"
    pageRef = "/chemistry"
    weight = 4
  [[menu.main]]
    name = "Physics"
    pageRef = "/physics"
    weight = 5
  [[menu.main]]
    name = "About"
    pageRef = "/about"
    weight = 6
  [[menu.main]]
    name = "Search"
    weight = 7
    [menu.main.params]
      type = "search"
